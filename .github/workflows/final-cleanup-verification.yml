name: Final cleanup verification
on:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Record updated dependency lockfile
        shell: bash
        run: |
          echo 'BEGIN_RESOLVED_LOCK_BASE64'
          base64 -w0 pubspec.lock
          echo
          echo 'END_RESOLVED_LOCK_BASE64'
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
